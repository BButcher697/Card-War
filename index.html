<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Card Wars</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <!-- CARDWARS MOBILE START -->
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    overflow: hidden !important;
    background: #03120d !important;
    overscroll-behavior: none;
  }
  #unity-container, .unity-container {
    position: fixed !important;
    left: 0 !important;
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    transform: none !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    background: #03120d !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #unity-container.unity-desktop {
    width: 100vw !important;
    height: 100vh !important;
  }
  #unity-container.unity-mobile {
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
  }
  #unity-fullscreen-container {
    position: relative !important;
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #unity-canvas, .unity-canvas {
    width: 100% !important;
    height: 100% !important;
    max-width: 100vw !important;
    max-height: 100vh !important;
    max-height: 100dvh !important;
    aspect-ratio: auto !important;
    object-fit: fill !important;
    display: block !important;
    background: #03120d !important;
    touch-action: none;
    image-rendering: auto !important;
  }
  #unity-footer, .unity-footer, #unity-build-title, #unity-logo-title-footer, #unity-loading-container, #unity-loading-bar {
    display: none !important;
  }

  /* ---- Card Wars Arcade Primary Game Loader ---- */
  #cw-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 75% at 50% 38%, rgba(255,255,255,.25), rgba(0,0,0,.38)), repeating-conic-gradient(from 0deg at 50% 38%, #3F97EE 0 7.5deg, #2E80DC 7.5deg 15deg);
    transition: opacity 0.4s ease-out;
    user-select: none;
    -webkit-user-select: none;
  }
  .cw-loader-wrap {
    width: 100%;
    max-width: 390px;
    height: 100%;
    max-height: 844px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    padding: 72px 24px 56px;
    position: relative;
  }
  .cw-loader-bot {
    margin-top: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .f { font-family: "Lilita One", sans-serif; font-weight: 400; }
  .st {
    text-shadow:
      -2px -2px 0 #1B1B22,  2px -2px 0 #1B1B22,
      -2px  2px 0 #1B1B22,  2px  2px 0 #1B1B22,
       0px -2px 0 #1B1B22,  0px  2px 0 #1B1B22,
      -2px  0px 0 #1B1B22,  2px  0px 0 #1B1B22,
       0px  4px 0 #1B1B22;
  }
  .ld-logo {
    font-size: 76px;
    line-height: 0.88;
    text-align: center;
    transform: rotate(-4deg);
    color: #FFFFFF;
    margin-top: 16px;
    text-shadow:
      -3px -3px 0 #1B1B22,  3px -3px 0 #1B1B22,
      -3px  3px 0 #1B1B22,  3px  3px 0 #1B1B22,
       0px -3px 0 #1B1B22,  0px  3px 0 #1B1B22,
      -3px  0px 0 #1B1B22,  3px  0px 0 #1B1B22,
       0px  6px 0 #1B1B22;
    animation: ld-float 3s ease-in-out infinite alternate;
  }
  .ld-fan {
    position: relative;
    width: 200px;
    height: 140px;
    margin-top: 48px;
    animation: ld-bob 1.2s ease-in-out infinite alternate;
  }
  .ld-fan .cd {
    position: absolute;
    left: 65px;
    top: 15px;
    width: 70px;
    height: 100px;
    box-sizing: border-box;
    border: 3px solid #1B1B22;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 35%), var(--c);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), 0 5px 0 #1B1B22;
    font: 400 28px "Lilita One", sans-serif;
    transform-origin: 50% 115%;
    animation: ld-fan 1.6s ease-in-out infinite;
  }
  .ld-fan .cd:nth-child(1) { --a: -30deg; }
  .ld-fan .cd:nth-child(2) { --a: 0deg; }
  .ld-fan .cd:nth-child(3) { --a: 30deg; }
  .ld-fan .cd .ov {
    width: 74%;
    height: 62%;
    border: 3px solid #1B1B22;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-18deg);
    color: var(--t);
  }
  .cr { --c: #E8343A; --t: #C2262C; }
  .cb { --c: #2E8BEA; --t: #1B6BC4; }
  .cg { --c: #2DBE5A; --t: #1E8F42; }

  .ld-lbl {
    font-size: 26px;
    color: #FFFFFF;
    letter-spacing: 1px;
  }
  .ld-bar {
    width: 100%;
    max-width: 320px;
    height: 34px;
    box-sizing: border-box;
    background: #2A2A32;
    border: 3px solid #1B1B22;
    border-radius: 12px;
    box-shadow: inset 0 0 0 3px #50505B, 0 4px 0 #1B1B22;
    overflow: hidden;
    padding: 4px;
  }
  .ld-fill {
    display: block;
    height: 100%;
    width: 6%;
    box-sizing: border-box;
    border-radius: 6px;
    border: 2px solid #1B1B22;
    background-color: #2DBE5A;
    background-image: linear-gradient(135deg, rgba(255,255,255,.28) 25%, transparent 25% 50%, rgba(255,255,255,.28) 50% 75%, transparent 75%);
    background-size: 40px 40px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35);
    animation: ld-stripes .8s linear infinite;
    transition: width 0.25s ease-out;
  }
  @keyframes ld-float { from { transform: rotate(-4deg) translateY(-6px); } to { transform: rotate(-4deg) translateY(6px); } }
  @keyframes ld-bob { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
  @keyframes ld-fan { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(var(--a)); } }
  @keyframes ld-dot { 0%, 20% { opacity: 0; } 40%, 100% { opacity: 1; } }
  @keyframes ld-stripes { to { background-position: 40px 0; } }
  .ld-dots span { animation: ld-dot 1.2s infinite; }
  .ld-dots span:nth-child(2) { animation-delay: .2s; }
  .ld-dots span:nth-child(3) { animation-delay: .4s; }

  @media (prefers-reduced-motion: reduce) {
    .ld-logo, .ld-fan, .ld-fan .cd, .ld-fill, .ld-dots span { animation: none !important; }
    .ld-dots span { opacity: 1; }
  }
</style>
<!-- CARDWARS MOBILE END -->
</head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
        <div id="cw-loader">
          <div class="cw-loader-wrap">
            <div class="f st ld-logo">CARD<br><span style="color:#FFC31F">WARS</span></div>
            <div class="ld-fan" aria-hidden="true">
              <div class="cd cg"><b class="ov">5</b></div>
              <div class="cd cr"><b class="ov">7</b></div>
              <div class="cd cb"><b class="ov">3</b></div>
            </div>
            <div class="cw-loader-bot" role="status" aria-label="Loading">
              <div class="f st ld-lbl">LOADING<span class="ld-dots"><span>.</span><span>.</span><span>.</span></span></div>
              <div class="ld-bar"><i class="ld-fill" id="cw-progress-fill"></i></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Card Wars</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/render-deploy.loader.js";
      var config = {
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.6),
        arguments: [],
        dataUrl: buildUrl + "/render-deploy.data",
        frameworkUrl: buildUrl + "/render-deploy.framework.js",
        codeUrl: buildUrl + "/render-deploy.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "Card Wars",
        productVersion: "0.1.1",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "1080px";
        fullscreenContainer.style.height = "1920px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const cwLoader = document.querySelector("#cw-loader");
        const cwProgressFill = document.querySelector("#cw-progress-fill");

        createUnityInstance(canvas, config, (progress) => {
          if (cwProgressFill) {
            cwProgressFill.style.width = Math.min(100, Math.max(6, Math.round(progress * 100))) + "%";
          }
        }).then((unityInstance) => {
          if (cwProgressFill) {
            cwProgressFill.style.width = "100%";
          }
          if (cwLoader) {
            cwLoader.style.opacity = "0";
            cwLoader.style.pointerEvents = "none";
            setTimeout(function() {
              cwLoader.style.display = "none";
            }, 400);
          }
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
